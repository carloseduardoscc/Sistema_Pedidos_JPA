<!doctype html>
<html lang="pt-BR" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Order Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background:
                    linear-gradient(rgba(15, 23, 42, 0.82), rgba(15, 23, 42, 0.82)),
                    url("https://images.unsplash.com/photo-1557683316-973673baf926?auto=format&fit=crop&w=1600&q=80");
            background-size: cover;
            background-position: center;
        }

        .login-wrapper {
            min-height: 100vh;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            border: 0;
            border-radius: 1.5rem;
            box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(10px);
        }

        .brand-icon {
            width: 56px;
            height: 56px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 1rem;
            background: linear-gradient(135deg, #0d6efd, #6610f2);
            color: #fff;
            font-size: 1.7rem;
        }

        .form-control {
            border-radius: 0.9rem;
        }

        .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
        }

        .password-toggle {
            border-radius: 0 0.9rem 0.9rem 0;
        }

        .btn-login {
            border-radius: 0.9rem;
            padding: 0.8rem;
            font-weight: 600;
        }

        .login-footer-text {
            color: #64748b;
            font-size: 0.9rem;
        }

        .link-muted {
            color: #475569;
            text-decoration: none;
        }

        .link-muted:hover {
            color: #0d6efd;
            text-decoration: underline;
        }
    </style>
</head>

<body>
<main class="login-wrapper d-flex align-items-center justify-content-center p-3">
    <section class="card login-card">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="brand-icon mb-3">
                    <i class="bi bi-box-seam"></i>
                </div>

                <h1 class="h3 fw-bold mb-2">Bem-vindo ao e-commerce mais famoso do Brasil!</h1>
                <p class="text-secondary mb-0">
                    Entre com sua conta para acessar o sistema.
                </p>
            </div>

            <div class="alert alert-danger d-none" id="loginErrorMessage" role="alert">
                <i class="bi bi-exclamation-circle me-1"></i>
                E-mail ou senha inválidos.
            </div>

            <form action="/login" method="post" th:action="@{/login}" class="needs-validation" novalidate>
                <!--
                    Se você estiver usando Thymeleaf com CSRF ativo no Spring Security,
                    descomente a linha abaixo:

                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                -->

                <div class="form-floating mb-3">
                    <input
                            type="email"
                            class="form-control"
                            id="username"
                            name="username"
                            placeholder="nome@email.com"
                            autocomplete="email"
                            required
                    >
                    <label for="username">
                        <i class="bi bi-envelope me-1"></i>
                        E-mail
                    </label>
                    <div class="invalid-feedback">
                        Informe um e-mail válido.
                    </div>
                </div>

                <div class="mb-3">
                    <div class="input-group">
                        <div class="form-floating">
                            <input
                                    type="password"
                                    class="form-control"
                                    id="password"
                                    name="password"
                                    placeholder="Sua senha"
                                    autocomplete="current-password"
                                    required
                            >
                            <label for="password">
                                <i class="bi bi-lock me-1"></i>
                                Senha
                            </label>
                        </div>

                        <button
                                class="btn btn-outline-secondary password-toggle"
                                type="button"
                                id="togglePasswordButton"
                                aria-label="Mostrar ou ocultar senha"
                        >
                            <i class="bi bi-eye" id="togglePasswordIcon"></i>
                        </button>

                        <div class="invalid-feedback">
                            Informe sua senha.
                        </div>
                    </div>
                </div>

                <button class="btn btn-primary btn-login w-100" type="submit">
                    <i class="bi bi-box-arrow-in-right me-1"></i>
                    Entrar
                </button>
            </form>
        </div>
    </section>
</main>

<script>
    const togglePasswordButton = document.getElementById("togglePasswordButton");
    const togglePasswordIcon = document.getElementById("togglePasswordIcon");
    const passwordInput = document.getElementById("password");

    togglePasswordButton.addEventListener("click", () => {
        const isPasswordHidden = passwordInput.type === "password";

        passwordInput.type = isPasswordHidden ? "text" : "password";
        togglePasswordIcon.className = isPasswordHidden ? "bi bi-eye-slash" : "bi bi-eye";
    });

    (() => {
        const forms = document.querySelectorAll(".needs-validation");

        forms.forEach((form) => {
            form.addEventListener("submit", (event) => {
                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                }

                form.classList.add("was-validated");
            });
        });
    })();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
