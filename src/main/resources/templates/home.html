<!doctype html>
<html lang="pt-BR" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | Order Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background:
                    linear-gradient(rgba(15, 23, 42, 0.82), rgba(15, 23, 42, 0.82)),
                    url("https://images.unsplash.com/photo-1557683316-973673baf926?auto=format&fit=crop&w=1600&q=80");
            background-size: cover;
            background-position: center;
        }

        .home-wrapper {
            min-height: 100vh;
        }

        .home-card {
            width: 100%;
            max-width: 650px;
            border: 0;
            border-radius: 1.5rem;
            box-shadow: 0 1.5rem 4rem rgba(0,0,0,.35);
            backdrop-filter: blur(10px);
        }

        .brand-icon {
            width: 72px;
            height: 72px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 1rem;
            background: linear-gradient(135deg, #198754, #0d6efd);
            color: white;
            font-size: 2rem;
        }

        .btn-rounded {
            border-radius: .9rem;
            padding: .8rem;
            font-weight: 600;
        }
    </style>
</head>

<body>

<main class="home-wrapper d-flex align-items-center justify-content-center p-3">

    <section class="card home-card">
        <div class="card-body text-center p-5">

            <div class="brand-icon mx-auto mb-4">
                <i class="bi bi-check2-circle"></i>
            </div>

            <h1 class="display-6 fw-bold mb-3">
                Login realizado com sucesso! 🎉
            </h1>

            <p class="lead text-secondary mb-4">
                Seja bem-vindo ao <strong>Order Management</strong>.
            </p>

            <div class="alert alert-success">
                <i class="bi bi-shield-check me-2"></i>
                Sua autenticação foi realizada com sucesso <span th:text="${username}">Usuário</span>
            </div>

            <p class="text-muted mb-4">
                Esta é apenas uma página de teste para validar o fluxo de autenticação
                do Spring Security.
            </p>

            <div class="d-grid gap-2 d-md-flex justify-content-md-center">

                <a th:href="@{/}"
                   class="btn btn-primary btn-rounded">
                    <i class="bi bi-house-door me-1"></i>
                    Página Inicial
                </a>

                <form th:action="@{/logout}" method="post">
                    <button class="btn btn-outline-danger btn-rounded">
                        <i class="bi bi-box-arrow-right me-1"></i>
                        Sair
                    </button>
                </form>

            </div>

        </div>
    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
