# Database
spring:
  datasource:
    username: sa
    url: "jdbc:h2:mem:testdb;INIT=CREATE SCHEMA IF NOT EXISTS order_management"
    password: ''
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      data-locations: classpath:sql/seed-test.sql
  jpa:
    show-sql: true
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      settings:
        web-allow-others: true
      enabled: true
      path: /h2-console

# Logging
logging:
  level:
    br:
      com:
        carloseduscc:
          projetoestudos: debug
#    org.springframework:
#      security: debug
#      web: debug

# Doc
springdoc:
  override-with-generic-response: false