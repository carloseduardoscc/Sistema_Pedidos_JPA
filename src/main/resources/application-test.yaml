logging:
  level:
    org:
      springframework:
        security: DEBUG
spring:
  datasource:
    username: sa
    url: "jdbc:h2:mem:testdb;INIT=CREATE SCHEMA IF NOT EXISTS order_management"
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      settings:
        web-allow-others: true
      enabled: true
      path: /h2-console